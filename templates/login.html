<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | UniBoLSas</title>
    <!-- CSS do Bootstrap 5 e Ícones -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body class="bg-secondary-subtle d-flex flex-column min-vh-100">

    <!-- Barra de navegação  -->
    <nav class="navbar navbar-dark bg-dark shadow">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="index.html">
                <i class="bi bi-mortarboard-fill me-2"></i>Uni<span class="text-white">BoLSas</span>
            </a>
            <a href="index.html" class="btn btn-outline-light btn-sm rounded-pill">
                <i class="bi bi-arrow-left me-1"></i>Voltar ao Início
            </a>
        </div>
    </nav>

    <!-- autenticação -->
    <main class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                
                <div class="card bg-white border-0 shadow-sm rounded-4 p-4">
                    
                    <!-- Cabeçalho  -->
                    <div class="text-center mb-4">
                        <div class="d-inline-flex align-items-center justify-content-center bg-primary-subtle text-primary rounded-circle mb-3" style="width: 60px; height: 60px;">
                            <i class="bi bi-person-fill fs-2"></i>
                        </div>
                        <h4 class="fw-bold text-dark">Acede à tua Conta</h4>
                       
                    </div>

                 
                    

                    <div class="tab-content" id="authTabContent">
                        
                        <!-- Painel de Login -->
                        <div class="tab-pane fade show active" id="login-panel" role="tabpanel">
                            <form action="/dashboard.html">
                                <div class="mb-3">
                                    <label class="form-label text-dark small fw-bold">Email Institucional ou Pessoal</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="bi bi-envelope text-muted"></i></span>
                                        <input type="email" class="form-control" placeholder="fulano@gmail.com" required>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <div class="d-flex justify-content-between align-items-center mb-1">
                                        <label class="form-label text-dark small fw-bold m-0">Palavra-passe</label>
                                                                            </div>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="bi bi-lock text-muted"></i></span>
                                        <input type="password" class="form-control" placeholder="••••••••" required>
                                    </div>
                                </div>
                                <div class=" mb-3">
                                    <input class="form-check-input" type="checkbox" id="rememberMe">
                                     <label  class="form-check-label small text-muted" >   Manter sessão iniciada
                                        <a style=" margin-left: 70px;" href="#" class=" text-decoration-none">Esqueceu a palavra-passe?</a>
                                     
                                    </label>
                                </div>
                                <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-bold">
                                    Iniciar Sessão <i class="bi bi-box-arrow-in-right ms-1"></i>
                                </button>
                              
                                <div style=" margin-top: 20px;">
                                     
                                     <label style="margin-left: 75px;" class="form-check-label small text-muted" >   Não tem uma conta?
                                        <a style=" margin-left: 6px;" href="criar_conta.html" class=" text-decoration-none">Criar uma Conta</a>
                                     
                                    </label>
                                        
                                    
                                     
                                     
                                </div>

                            </form>
                        </div>

                        

                    </div>

                </div>

            </div>
        </div>
    </main>

    <!-- Rodapé -->
    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <small class="text-secondary">&copy; 2026 UniBoLSas - Todos os direitos reservados.</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
