<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Bolsas & Mentorias - ISPTEC</title>
    <!-- Importa o CSS do Bootstrap via CDN para dar estilo profissional aos botões e caixas -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Container centralizado com margem superior -->
    <div class="container mt-5">
        <h2 class="mb-4 text-primary">Plataforma de Bolsas & Mentorias (MVP)</h2>

        <!-- ============================================================== -->
        <!-- CARTÃO 1: FORMULÁRIO PARA O ADMINISTRADOR PUBLICAR BOLSA       -->
        <!-- ============================================================== -->
        <div class="card p-4 shadow-sm mb-4">
            <h4>Adicionar Nova Bolsa (Acesso Admin)</h4>

            <!-- 
                action="/adicionar": Envia os dados para a função 'adicionar()' no Python
                method="POST": Garante que os dados são enviados empacotados no corpo da requisição
            -->
            <form action="/adicionar" method="POST">
                
                <div class="mb-3">
                    <label class="form-label">Título da Bolsa:</label>
                    <!-- O atributo name="titulo" é a chave que o Python lê no request.form.get('titulo') -->
                    <input type="text" name="titulo" class="form-control" placeholder="Ex: Bolsa de Mérito ISPTEC 2026" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Descrição / Critérios de Seleção:</label>
                    <!-- O atributo name="descricao" é a chave que o Python lê no request.form.get('descricao') -->
                    <textarea name="descricao" class="form-control" rows="3" placeholder="Ex: Média mínima 15 valores..." required></textarea>
                </div>

                <!-- Botão de submissão do formulário -->
                <button type="submit" class="btn btn-success">Publicar Bolsa</button>
            </form>
        </div>

        <!-- ============================================================== -->
        <!-- CARTÃO 2: LISTA DE BOLSAS VINDAS DIRETAMENTE DO POSTGRESQL     -->
        <!-- ============================================================== -->
        <div class="card p-4 shadow-sm">
            <h4>Bolsas Publicadas Disponíveis</h4>

            <ul class="list-group mt-3">
                <!-- 
                    Jinja2: Ciclo for do Python executado no meio do HTML.
                    A variável 'bolsas' foi enviada pela função index() no app.py 
                -->
                {% for bolsa in bolsas %}
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        <div>
                            <!-- Imprime o título da bolsa vindo da coluna da BD -->
                            <h5 class="mb-1">{{ bolsa.titulo }}</h5>
                            <!-- Imprime a descrição da bolsa vinda da coluna da BD -->
                            <p class="mb-1 text-muted">{{ bolsa.descricao }}</p>
                        </div>
                        <!-- Botão que no futuro ligará à mentoria/candidatura -->
                        <button class="btn btn-outline-primary btn-sm">Candidatar-se</button>
                    </li>
                {% else %}
                    <!-- Caso a tabela 'bolsas' esteja vazia no PostgreSQL, exibe esta mensagem -->
                    <li class="list-group-item text-muted">Ainda não existem bolsas registadas no sistema.</li>
                {% endfor %}
            </ul>
        </div>

    </div>

</body>
</html>
