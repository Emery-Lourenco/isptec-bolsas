<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Bolsas & Mentorias - ISPTEC</title>
    <!-- Bootstrap CSS para um design limpo automático -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <h2 class="mb-4 text-primary">Plataforma de Bolsas de Estudo (MVP)</h2>

        <!-- Formulário para o Administrador adicionar bolsa -->
        <div class="card p-4 shadow-sm mb-4">
            <h4>Adicionar Nova Bolsa (Admin)</h4>
            <form action="/adicionar" method="POST">
                <div class="mb-3">
                    <label class="form-label">Título da Bolsa</label>
                    <input type="text" name="titulo" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Descrição / Requisitos</label>
                    <textarea name="descricao" class="form-control" rows="2" required></textarea>
                </div>
                <button type="submit" class="btn btn-success">Publicar Bolsa</button>
            </form>
        </div>

        <!-- Lista de Bolsas vindas do PostgreSQL -->
        <div class="card p-4 shadow-sm">
            <h4>Bolsas Disponíveis no Sistema</h4>
            <ul class="list-group mt-3">
                {% for bolsa in bolsas %}
                    <li class="list-group-item">
                        <strong>{{ bolsa.titulo }}</strong>: {{ bolsa.descricao }}
                    </li>
                {% else %}
                    <li class="list-group-item text-muted">Ainda nenhuma bolsa publicada.</li>
                {% endfor %}
            </ul>
        </div>
    </div>

</body>
</html>
